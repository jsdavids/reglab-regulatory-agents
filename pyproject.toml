[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "regagents"
version = "0.1.0"
description = "Regulatory research agents: pull eCFR text over MCP, flag duplicate or outdated reporting requirements, and cite the exact sections relied on. Evaluated against hand labels."
requires-python = ">=3.12"
dependencies = [
    "agentmesh @ https://github.com/jsdavids/agent-mesh-core/archive/refs/tags/v0.1.0.tar.gz",
    "httpx>=0.28",
    "numpy>=2.1",
    "scipy>=1.14",  # sparse matrix products for all-pairs similarity
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]
llm = ["agentmesh[llm] @ https://github.com/jsdavids/agent-mesh-core/archive/refs/tags/v0.1.0.tar.gz"]

[project.scripts]
regagents = "regagents.cli:main"

[tool.hatch.metadata]
allow-direct-references = true  # agentmesh is installed from its GitHub release tarball (no git needed)

[tool.hatch.build.targets.wheel]
packages = ["src/regagents"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
